name: Build WH Bridge

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: true

  push:
    branches: [game-updates, game-updates-17]

permissions:
  contents: write

concurrency:
  group: wh-bridge-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout PS5 Payload SDK
        uses: actions/checkout@v4
        with:
          repository: echo-storm/ps5-payload-sdk
          path: ps5-payload-sdk
          submodules: recursive
          # Si le SDK est privé, ajouter un token adapté.

      - name: Configure PS5 SDK
        run: |
          echo "PS5_PAYLOAD_SDK=$GITHUB_WORKSPACE/ps5-payload-sdk" >> "$GITHUB_ENV"
          chmod +x ps5-payload-sdk/bin/prospero-clang
          
      - name: Build WH Bridge
        run: |
          set -e

          CC="$PS5_PAYLOAD_SDK/bin/prospero-clang"

          SRCS="util.c remote.c hookpoint.c prelude.c server.c install.c main.c"
          OBJS=""

          for f in $SRCS; do
            o="${f%.c}.o"
            "$CC" -Wall -g -c "$f" -o "$o"
            OBJS="$OBJS $o"
          done

          "$CC" -c embed.S -o embed.o
          OBJS="$OBJS embed.o"

          "$CC" -Wall -g -pie -o wh_bridge.elf $OBJS -lSceUserService

          echo "Successfully built wh_bridge.elf"

      - name: Generate SHA256
        run: |
          sha256sum wh_bridge.elf | tee wh_bridge.elf.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wh-bridge
          if-no-files-found: error
          path: |
            wh_bridge.elf
            wh_bridge.elf.sha256

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          VERSION="wh-bridge-${GITHUB_RUN_NUMBER}"

          gh release create "$VERSION" \
            wh_bridge.elf \
            wh_bridge.elf.sha256 \
            --target "$GITHUB_SHA" \
            --title "WH Bridge Build ${GITHUB_RUN_NUMBER}" \
            --notes "WH Bridge compiled from commit $GITHUB_SHA."
